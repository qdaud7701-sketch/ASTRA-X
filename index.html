<script>
const T=THREE,R=Math.random,$=id=>document.getElementById(id),PI=Math.PI;
const KB={
fuel:["Rocket Fuel Cell","Fuel and an oxidizer react and expand fast; the exhaust pushes the rocket the other way (Newton’s 3rd law).","Space has no air, so rockets carry both fuel and oxygen.","NASA’s Mars landers carry fuel for the final descent burn."],

const sc=new T.Scene(),cam=new T.PerspectiveCamera(65,1,.1,700),rd=new T.WebGLRenderer({antialias:true});

const tg=new T.PlaneGeometry(500,500,120,120);tg.rotateX(-PI/2);const pa=tg.attributes.position,col=[];

tg.setAttribute("color",new T.Float32BufferAttribute(col,3));const cv=document.createElement("canvas");cv.width=cv.height=256;const cx2=cv.getContext("2d");cx2.fillStyle="#c9967a";cx2.fillRect(0,0,256,256);for(let i=0;i<4000;i++){const v=150+R()*100|0;cx2.fillStyle=`rgba(${v},${v*.72|0},${v*.55|0},.4)`;const q=1+R()*3;cx2.fillRect(R()*256,R()*256,q,q)}const gt=new T.CanvasTexture(cv);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(90,90);gt.anisotropy=4;

const gg=new T.IcosahedronGeometry(r,1),pp=gg.attributes.position;for(let q=0;q<pp.count;q++){const X=pp.getX(q),Y=pp.getY(q),Z=pp.getZ(q),f=1+Math.sin(X*7+Y*5+Z*3)*.2;pp.setXYZ(q,X*f,Y*f*.75,Z*f)}gg.computeVertexNormals();const m=new T.Mesh(gg,new T.MeshStandardMaterial({color:new T.Color().setHSL(.04+R()*.03,.35,.2+R()*.13),roughness:1,flatShading:true}));m.castShadow=m.receiveShadow=true;m.position.set(x,H(x,z)+r*.3,z);m.rotation.y=R()*6;sc.add(m);if(r>1.4)rocks.push({x,z,r:r*.9})}

const sp=add(new T.BoxGeometry(2.2,.06,1.4),mat(0x1a3a8f),0,1.5,-.9,RV);sp.rotation.x=-.25;add(new T.CylinderGeometry(.05,.05,1.6),rm,.8,1.9,-1.2,RV);add(new T.SphereGeometry(.18),IND,0,1.9,1.5,RV);

spawn("fuel",3);spawn("iron",14);spawn("ice",10);spawn("scrap",8);spawn("circuit",6);spawn("o2",4);spawn("food",5);
// player
const P=new T.Group(),p={x:6,z:6,y:0,vy:0};let faceM;
function buildP(){const s=mat(suit);add(new T.CylinderGeometry(.42,.48,1.1,12),s,0,1.05,0,P);add(new T.SphereGeometry(.4,14,14),s,0,1.85,0,P);

// state
const inv={iron:0,ice:0,scrap:0,circuit:0,fuel:0};let hp=100,o2=100,food=100,bat=100,yaw=0,pitch=.35,inR=0,storm=0,stT=40,mT=8,scanT=0,run=0,jump=0,sigDone=0,toastT=0,hudT=0,jx=0,jy=0,met=[],won=0,clock=0;
const keys={};
function toast(s,t){const e=$("tt");e.textContent=s;e.style.display="block";toastT=t||3}
function ov(h){$("ob2").innerHTML=h;$("ov").style.display="flex";paused=true}function hide(){$("ov").style.display="none";paused=false}
function learn(k){if(known[k])return;known[k]=1;kp+=10;showK(k,1)}
function showK(k,fresh){const e=KB[k];ov(`<h2>${fresh?"🔓 New knowledge: ":""}${e[0]}</h2><p><b>How it works:</b> ${e[1]}</p><p><b>Why in space:</b> ${e[2]}</p><p><b>NASA link:</b> ${e[3]}</p><p class="mu">Simplified for gameplay. ${fresh?"+10 knowledge points.":""}</p><button class="p" onclick="hide()">Continue</button>${fresh?"":'<button onclick="lib()">Back</button>'}`)}
function lib(){const ks=Object.keys(known);ov(`<h2>📚 Knowledge Database</h2><p class="mu">Knowledge points: ${kp}</p>${ks.length?ks.map(k=>`<button onclick="showK('${k}')">${KB[k][0]}</button>`).join(""):"<p>Discover items to unlock entries.</p>"}<p><button class="p" onclick="hide()">Close</button></p>`)}
const RC=[["Repair Rover",{scrap:2,circuit:1,iron:1},()=>{if(rover.fixed)return 0;rover.fixed=1;IND.color.set(0x2ec27e);IND.emissive.set(0x1a8a55);learn("rover");toast("Rover repaired! Stand near it and press R.");return 1}],
["Oxygen Generator (+100 O₂)",{ice:2,iron:1},()=>{o2=100;toast("Oxygen restored by electrolysis!");return 1}],["Medical Kit (+50 health)",{scrap:1,ice:1},()=>{hp=Math.min(100,hp+50);return 1}],["Solar Charger (+60 battery)",{circuit:1,iron:1},()=>{bat=Math.min(100,bat+60);learn("solar");return 1}]];
function craft(){ov(`<h2>🛠 Crafting</h2><p class="mu">Iron ${inv.iron} · Ice ${inv.ice} · Scrap ${inv.scrap} · Circuits ${inv.circuit} · Fuel ${inv.fuel}</p>`+RC.map((r,i)=>{const ok=Object.keys(r[1]).every(k=>inv[k]>=r[1][k])&&!(i==0&&rover.fixed);return `<p><button ${ok?"":"disabled"} onclick="mk(${i})">${r[0]}</button><br><span class="mu">Needs: ${Object.entries(r[1]).map(a=>a[1]+" "+a[0]).join(", ")}</span></p>`}).join("")+`<button class="p" onclick="hide()">Close</button>`)}
function mk(i){const r=RC[i];if(!Object.keys(r[1]).every(k=>inv[k]>=r[1][k]))return;for(const k in r[1])inv[k]-=r[1][k];r[2]();hide()}

if(a=="r"){if(inR){inR=0;P.visible=true;p.x=RV.position.x+3;p.z=RV.position.z}else if(Math.hypot(p.x-RV.position.x,p.z-RV.position.z)<6){if(rover.fixed){inR=1;P.visible=false}else toast("Rover is damaged. Craft Repair Rover (C).")}else toast("Move closer to the rover.")}}
addEventListener("keydown",e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();keys[k]=1;if(k==" "){jump=1;e.preventDefault()}if(k=="r")act("r");if(k=="c")act("c");if(k=="k")act("k");if(k=="q")act("q")});

const js=$("js"),kn=$("kn");function jm(e){const r=js.getBoundingClientRect();let dx=(e.clientX-r.left-55)/45,dy=(e.clientY-r.top-55)/45;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}jx=dx;jy=dy;kn.style.transform=`translate(${dx*35}px,${dy*35}px)`}
